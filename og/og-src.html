<!doctype html>
<!-- Source of og.png (1200x630). Render: open at 1200x630 in headless Chrome and screenshot. -->
<meta charset="utf-8">
<style>
  @font-face { font-family: "Open Runde"; font-weight: 500; src: url(../fonts/open-runde-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Open Runde"; font-weight: 600; src: url(../fonts/open-runde-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Open Runde"; font-weight: 700; src: url(../fonts/open-runde-latin-700-normal.woff2) format("woff2"); }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #f5f5f5; font-family: "Open Runde", sans-serif; color: #101114; padding: 44px; }
  .card { height: 100%; background: #fff; border: 2px solid #e6e8ea; border-radius: 36px; padding: 48px 56px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 48px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 30px; }
  .brand svg { width: 52px; height: 52px; }
  h1 { font-size: 92px; line-height: 1; letter-spacing: -.03em; font-weight: 700; margin-top: 54px; }
  h1 em { font-style: normal; color: #c12c57; }
  p { font-size: 27px; color: #6e6e6e; margin-top: 22px; font-weight: 500; line-height: 1.3; }
  .chips { display: flex; gap: 10px; margin-top: 30px; }
  .chip { height: 44px; padding: 0 16px; border-radius: 12px; font-size: 21px; font-weight: 600; display: flex; align-items: center; }
  .up { background: #fff0f4; color: #c12c57; } .down { background: #f1edff; color: #6941c6; }
  .rows { display: grid; gap: 14px; align-content: center; }
  .row { display: grid; grid-template-columns: 48px 56px 1fr auto; align-items: center; gap: 14px; border: 1px solid #e6e8ea; border-radius: 18px; padding: 14px 20px; font-size: 26px; font-weight: 600; }
  .n { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 22px; background: #f4f4f5; color: #6e6e6e; }
  .row:nth-child(1) .n { background: #ff87a6; color: #7a1230; } .row:nth-child(2) .n { background: #a293ff; color: #2a1a6e; }
  .av { width: 52px; height: 52px; border-radius: 50%; }
  .bar { height: 14px; border-radius: 9px; background: #ececee; }
  .pos { color: #0f7a42; font-weight: 700; } .neg { color: #c0403d; font-weight: 700; }
</style>
<div class="card">
  <div>
    <div class="brand"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#ff87a6"/><path d="M10 34h11l5-14 9 26 6-18 3 6h10" fill="none" stroke="#7a1230" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>Pulse Board</div>
    <h1>Who's <em>up</em> on Pulse?</h1>
    <p>XO Market's BTC 5-minute rounds, ranked by net profit / loss.</p>
    <div class="chips"><span class="chip up">PnL competition</span><span class="chip down">Find your rank</span></div>
  </div>
  <div class="rows">
    <div class="row"><span class="n">1</span><span class="av" style="background:#ff87a6"></span><span class="bar" style="width:92%"></span><span class="pos">+$147</span></div>
    <div class="row"><span class="n">2</span><span class="av" style="background:#a293ff"></span><span class="bar" style="width:74%"></span><span class="pos">+$27</span></div>
    <div class="row"><span class="n">3</span><span class="av" style="background:#2fc04a"></span><span class="bar" style="width:60%"></span><span class="pos">+$22</span></div>
    <div class="row"><span class="n">4</span><span class="av" style="background:#f7931a"></span><span class="bar" style="width:44%"></span><span class="neg">−$83</span></div>
    <div class="row"><span class="n">?</span><span class="av" style="background:#ececee"></span><span style="color:#8a8f98">you</span><span style="color:#8a8f98">?</span></div>
  </div>
</div>
